[package]
name = "wscall"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Facade crate for the WSCALL protocol, server, and client"
documentation = "https://docs.rs/wscall"
readme = "../../README.md"
keywords = ["websocket", "rpc", "api", "async", "protocol"]
categories = ["network-programming", "web-programming::websocket", "asynchronous"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
server = ["dep:wscall-server"]
client = ["dep:wscall-client"]
full = ["server", "client"]

[dependencies]
regex.workspace = true
validator.workspace = true
wscall-client = { path = "../wscall-client", version = "0.5.1", optional = true }
wscall-protocol = { path = "../wscall-protocol", version = "0.5.1" }
wscall-server = { path = "../wscall-server", version = "0.5.1", optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
futures-util.workspace = true
tokio-tungstenite.workspace = true
tracing-subscriber.workspace = true

[[example]]
name = "demo_server"
path = "examples/demo_server.rs"
required-features = ["server"]

[[example]]
name = "demo_client"
path = "examples/demo_client.rs"
required-features = ["client"]

[[example]]
name = "quick_start"
path = "examples/quick_start.rs"
required-features = ["full"]
