[workspace]
members = [
    "crates/wscall-protocol",
    "crates/wscall-server",
    "crates/wscall-client",
    "crates/wscall",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/Hinsir-zxc/wscall"
homepage = "https://github.com/Hinsir-zxc/wscall"

[workspace.dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chacha20poly1305 = "0.10"
futures-util = "0.3"
getrandom = "0.2"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.45", features = ["full"] }
tokio-tungstenite = "0.24"
uuid = { version = "1.18", features = ["serde", "v4"] }
validator = { version = "0.20", features = ["derive"] }
