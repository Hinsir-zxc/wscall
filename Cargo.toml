[workspace]
members = [
    "crates/wscall-protocol",
    "crates/wscall-server",
    "crates/wscall-client",
    "crates/wscall",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/Hinsir-zxc/wscall"
homepage = "https://github.com/Hinsir-zxc/wscall"

[workspace.dependencies]
aes-gcm = "0.10"
arc-swap = "1"
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
dashmap = "6"
futures-util = "0.3"
getrandom = "0.2"
regex = "1.11"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
tokio = { version = "1.45", features = ["full"] }
tokio-tungstenite = "0.24"
uuid = { version = "1.18", features = ["serde", "v4", "v7"] }
validator = { version = "0.20", features = ["derive"] }
